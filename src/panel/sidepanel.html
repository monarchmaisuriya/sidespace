<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sidespace</title>
  <link rel="stylesheet" href="sidepanel.css">
  <script type="module" src="sidepanel.js"></script>
</head>
<body>
  <div class="shell rail-right tabs-in-rail" id="shell">
    <aside class="rail" id="rail" aria-label="Apps and tabs">
      <div class="rail-list" id="rail-apps" role="list" aria-label="Apps"></div>
      <button class="rail-button quiet" id="add-app" title="Add an app" aria-label="Add an app">
        <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>
      </button>
      <hr class="rail-divider" id="rail-divider">
      <div class="rail-list" id="rail-tabs" role="list" aria-label="Open tabs"></div>
      <button class="rail-button quiet" id="new-tab" title="New tab (Alt+T)" aria-label="New tab">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M12 9v6M9 12h6"/></svg>
      </button>
      <div class="rail-spacer"></div>
      <button class="rail-button" data-view="bookmarks" title="Bookmarks" aria-label="Bookmarks">
        <svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-3.5L7 20z"/></svg>
      </button>
      <button class="rail-button" data-view="notes" title="Notes" aria-label="Notes">
        <svg viewBox="0 0 24 24"><path d="M6 4h9l3 3v13H6zM9 11h6M9 15h4"/></svg>
      </button>
      <button class="rail-button" id="rail-settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle class="ring" cx="12" cy="12" r="3"/><path d="M10.3 3.6a1.7 1.7 0 0 1 3.4 0l.2 1.2a7 7 0 0 1 1.8 1l1.1-.4a1.7 1.7 0 0 1 2.1.7l.1.2a1.7 1.7 0 0 1-.4 2.2l-.9.8a7 7 0 0 1 0 2.1l.9.8a1.7 1.7 0 0 1 .4 2.2l-.1.2a1.7 1.7 0 0 1-2.1.7l-1.1-.4a7 7 0 0 1-1.8 1l-.2 1.2a1.7 1.7 0 0 1-3.4 0l-.2-1.2a7 7 0 0 1-1.8-1l-1.1.4a1.7 1.7 0 0 1-2.1-.7l-.1-.2a1.7 1.7 0 0 1 .4-2.2l.9-.8a7 7 0 0 1 0-2.1l-.9-.8a1.7 1.7 0 0 1-.4-2.2l.1-.2a1.7 1.7 0 0 1 2.1-.7l1.1.4a7 7 0 0 1 1.8-1z"/></svg>
      </button>
    </aside>

    <div class="column">
      <header class="toolbar">
        <button class="icon-button" id="back" title="Back (Alt+←)" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="icon-button" id="forward" title="Forward (Alt+→)" aria-label="Forward">
          <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button class="icon-button" id="reload" title="Reload (Alt+R)" aria-label="Reload">
          <svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 5v4h-4"/></svg>
        </button>
        <form id="address-form" class="address" autocomplete="off">
          <input id="address" type="text" spellcheck="false" placeholder="Search or enter address" aria-label="Address">
        </form>
        <button class="tabs-button" id="tabs-button" popovertarget="tab-drawer" title="All tabs" aria-label="All tabs">
          <span id="tab-count">1</span>
        </button>
        <button class="icon-button" id="menu-button" popovertarget="menu" title="Menu" aria-label="Menu">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="18.5" r="1.5"/></svg>
        </button>
      </header>

      <div class="hint" id="load-hint" hidden>
        <span>Page not showing?</span>
        <button class="link-button" id="hint-open-browser">Open in a browser tab</button>
        <button class="icon-button small" id="hint-dismiss" aria-label="Dismiss">
          <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>

      <main id="viewport">
        <section class="view speed-dial" id="speed-dial" hidden>
          <div class="home-part home-time" id="clock-time" data-section="clock"></div>
          <div class="home-part home-date" id="clock-date" data-section="date"></div>
          <form class="home-part dashboard-search" id="dashboard-search" data-section="search" autocomplete="off">
            <svg viewBox="0 0 24 24"><circle class="ring" cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
            <input id="dashboard-query" type="text" spellcheck="false" placeholder="Search or enter address" aria-label="Search or enter address">
          </form>
          <div class="home-part" data-section="shortcuts">
            <ul class="tiles" id="tiles"></ul>
            <p class="empty" id="tiles-empty">No shortcuts yet. Add one below, or choose <strong>Add to speed dial</strong> from the menu on any page.</p>
            <form class="add-shortcut" id="add-shortcut" autocomplete="off">
              <input id="shortcut-url" type="text" placeholder="Add a shortcut: example.com" aria-label="Shortcut address">
              <button type="submit" class="primary">Add</button>
            </form>
          </div>
        </section>

        <section class="view tool-view" id="bookmarks-view" hidden>
          <h2 class="view-title">Bookmarks</h2>
          <div class="view-header">
            <input type="search" id="bookmark-search" placeholder="Search bookmarks" aria-label="Search bookmarks">
            <button class="icon-button" id="bookmark-add" title="Bookmark the current panel page" aria-label="Bookmark the current panel page">
              <svg viewBox="0 0 24 24"><path d="M12 4l2.5 5.1 5.5.8-4 3.9.9 5.5L12 16.7l-4.9 2.6.9-5.5-4-3.9 5.5-.8z"/></svg>
            </button>
          </div>
          <nav class="crumbs" id="bookmark-crumbs" aria-label="Folder path"></nav>
          <ul class="list" id="bookmark-list"></ul>
          <div class="permission" id="bookmark-permission" hidden>
            <p>Sidespace needs permission to read your bookmarks. Nothing leaves your browser.</p>
            <button class="primary" id="bookmark-grant">Allow access</button>
          </div>
        </section>

        <section class="view tool-view" id="notes-view" hidden>
          <h2 class="view-title">Notes</h2>
          <textarea id="notes" maxlength="100000" spellcheck="true" placeholder="Quick notes. Saved automatically on this device." aria-label="Notes"></textarea>
          <div class="notes-footer">
            <span id="notes-status"></span>
            <button id="notes-copy">Copy</button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="tab-drawer" popover class="drawer" aria-label="All tabs">
    <ul class="drawer-list" id="tabs" role="tablist"></ul>
    <button class="drawer-new" id="drawer-new-tab">
      <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>New tab<kbd>Alt+T</kbd>
    </button>
  </div>

  <div id="menu" popover class="menu">
    <button data-command="new-tab">New tab<kbd>Alt+T</kbd></button>
    <button data-command="open-in-browser">Open in browser tab</button>
    <button data-command="load-current-tab">Load current browser tab here</button>
    <hr>
    <button data-command="toggle-pin" id="menu-pin">Pin to rail</button>
    <button data-command="add-shortcut">Add to speed dial</button>
    <hr>
    <label class="menu-toggle"><input type="checkbox" id="mobile-toggle">Mobile view for this site</label>
    <div class="zoom-row">
      <span>Zoom</span>
      <button data-command="zoom-out" aria-label="Zoom out">−</button>
      <output id="zoom-level">100%</output>
      <button data-command="zoom-in" aria-label="Zoom in">+</button>
    </div>
    <hr>
    <button data-command="close-tab">Close tab<kbd>Alt+W</kbd></button>
    <button data-command="settings">Settings</button>
  </div>

  <div id="rail-menu" popover class="menu context-menu" role="menu"></div>

  <dialog id="app-dialog" class="dialog" aria-labelledby="app-dialog-title">
    <form id="app-form" method="dialog" autocomplete="off">
      <h2 id="app-dialog-title">Add an app</h2>
      <label>Name<input id="app-name" type="text" placeholder="My app" maxlength="80"></label>
      <label>Address<input id="app-url" type="text" placeholder="example.com" spellcheck="false" required></label>
      <p class="form-error" id="app-error" role="alert" hidden></p>
      <div class="dialog-buttons">
        <button type="button" id="app-cancel">Cancel</button>
        <button type="submit" class="primary" id="app-save">Save</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
